[pytest]
; ── Test discovery ───────────────────────────────────────────────────
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

; ── Markers ──────────────────────────────────────────────────────────
markers =
    e2e: End-to-end browser tests
    api: API-level HTTP tests (CRUD)
    mock: Network mocking / interception tests
    positive: Happy-path / positive tests
    negative: Negative / error-path tests

; ── HTML report ──────────────────────────────────────────────────────
addopts =
    --html=reports/test_report.html
    --self-contained-html
    -v
